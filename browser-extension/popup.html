<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Element picker</title>
    <style>
      :root { color-scheme: dark; font: 14px/1.45 system-ui, sans-serif; }
      body { width: 260px; margin: 0; padding: 16px; background: #1e1e2e; color: #cdd6f4; }
      h1 { margin: 0 0 8px; font-size: 16px; }
      p { margin: 0 0 14px; color: #a6adc8; }
      button { width: 100%; padding: 10px 12px; border: 0; border-radius: 8px; background: #89b4fa; color: #1e1e2e; font: inherit; font-weight: 700; cursor: pointer; }
      button:disabled { opacity: .55; cursor: default; }
      #status { min-height: 20px; margin: 12px 0 0; }
    </style>
  </head>
  <body>
    <h1>Hide a page element</h1>
    <p>Pick an element on the current website. It will stay hidden on this site.</p>
    <button id="pick" type="button">Start element picker</button>
    <p id="status" role="status"></p>
    <script src="popup.js"></script>
  </body>
</html>
